name: "custom_rmouttogff3"
description: Convert RepeatMasker out file to gff3
keywords:
    - genomics
    - repeat
    - gff
tools:
    - "perl":
          description: "Bioinformatics Toolkit"
          homepage: "https://www.perl.org"
          documentation: "https://www.perl.org"
          tool_dev_url: "https://www.perl.org"
          licence:
              - "GPL"
          identifier: ""
input:
    - - meta:
            type: map
            description: |
                Groovy Map containing sample information
                e.g. `[ id:'sample1' ]`
      - rmout:
            type: file
            description: RepeatMasker out file
            pattern: "*.out"
            ontologies: []
output:
    gff3:
        - - meta:
                type: map
                description: |
                    Groovy Map containing sample information
                    e.g. `[ id:'sample1' ]`
          - "*.gff3":
                type: file
                description: GFF3 formatted output
                ontologies: []
    versions_perl:
        - versions.yml:
              type: file
              description: File containing software versions
              pattern: "versions.yml"
              ontologies:
                  - edam: http://edamontology.org/format_3750
topics:
    versions:
        - versions.yml:
              type: file
              description: File containing software versions
              pattern: "versions.yml"
              ontologies:
                  - edam: http://edamontology.org/format_3750
authors:
    - "@GallVp"
maintainers:
    - "@GallVp"
