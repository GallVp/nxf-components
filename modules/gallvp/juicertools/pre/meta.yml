name: "juicertools_pre"
description: Creates a HiC file
keywords:
    - genomics
    - hic
    - qc
tools:
    - "juicertools":
          description: "Visualization and analysis software for Hi-C data"
          homepage: "https://github.com/aidenlab/Juicebox"
          documentation: "https://github.com/aidenlab/Juicebox"
          tool_dev_url: "https://github.com/aidenlab/Juicebox"
          licence:
              - "MIT"
          identifier: ""
input:
    - - meta:
            type: map
            description: |
                Groovy Map containing sample information
                e.g. `[ id:'sample1' ]`
      - txt:
            type: file
            description: Text file containing HiC contacts
            pattern: "*.{txt}"
            ontologies:
                - edam: "http://edamontology.org/format_2572"
                - edam: "http://edamontology.org/format_2573"
                - edam: "http://edamontology.org/format_3462"
    - index:
          description: Index file
          type: file
          pattern: "*.{txt}"
          ontologies: []
    - sizes:
          type: file
          description: File containing the sizes of the chromosomes obtained from
              samtools faidx first two columns
          pattern: "*.{sizes}"
          ontologies: []
output:
    hic:
        - - meta:
                type: map
                description: |
                    Groovy Map containing sample information
                    e.g. `[ id:'sample1' ]`
          - "*.hic":
                type: file
                description: Output HiC file
                pattern: "*.{hic}"
                ontologies:
                    - edam: "http://edamontology.org/format_2572"
                    - edam: "http://edamontology.org/format_2573"
                    - edam: "http://edamontology.org/format_3462"
    versions_juicertools:
        - - ${task.process}:
                type: string
                description: The name of the process
          - juicertools:
                type: string
                description: The name of the tool
          - juicer_tools --version |& sed -n 's|Juicer Tools Version\(.*\)|\1|p':
                type: eval
                description: The expression to obtain the version of the tool
topics:
    versions:
        - - ${task.process}:
                type: string
                description: The name of the process
          - juicertools:
                type: string
                description: The name of the tool
          - juicer_tools --version |& sed -n 's|Juicer Tools Version\(.*\)|\1|p':
                type: eval
                description: The expression to obtain the version of the tool
authors:
    - "@GallVp"
maintainers:
    - "@GallVp"
