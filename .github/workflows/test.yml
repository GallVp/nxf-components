name: Run tests
on:
    pull_request:
        branches: [main]

# Cancel if a newer run is started
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
    NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    NF_TEST_VER: "0.9.5"

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: nf-core/setup-nextflow@v3
            - uses: j178/prek-action@v3.0.0

    nf-test-changes:
        name: nf-test-changes
        runs-on: ubuntu-latest
        outputs:
            # Expose detected tags as 'modules' and 'workflows' output variables
            paths: ${{ steps.list.outputs.components }}
            modules: ${{ steps.outputs.outputs.modules }}
            subworkflows: ${{ steps.outputs.outputs.subworkflows}}
            shard: ${{ steps.set-shards.outputs.shard }}
            total_shards: ${{ steps.set-shards.outputs.total_shards }}

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - name: List nf-test files
              id: list
              uses: ./.github/actions/detect-nf-test-changes
              with:
                  base: ${{ github.event.pull_request.base.sha }}
                  exclude_tags: "modules_nfcore"

            - name: Separate modules and subworkflows
              id: outputs
              run: |
                  echo modules=$(echo '${{ steps.list.outputs.components }}' | jq -c '. | map(select(contains("modules/gallvp/"))) | map(gsub("modules/gallvp/"; "") | gsub("/tests/main\\.nf\\.test$"; "")) | unique') >> $GITHUB_OUTPUT
                  echo subworkflows=$(echo '${{ steps.list.outputs.components }}' | jq -c '. | map(select(contains("subworkflows/gallvp/"))) | map(gsub("subworkflows/gallvp/"; "") | gsub("/tests/main\\.nf\\.test$"; "")) | unique') >> $GITHUB_OUTPUT

            - name: Get number of shards
              id: set-shards
              if: ${{ steps.list.outputs.components != '[]' }}
              uses: ./.github/actions/get-shards
              with:
                  max_shards: 4
                  paths: "${{ join(fromJson(steps.list.outputs.components), ' ') }}"

            - name: debug
              run: |
                  echo ${{ steps.list.outputs.components }}
                  echo ${{ steps.outputs.outputs.modules }}
                  echo ${{ steps.outputs.outputs.subworkflows }}
                  echo ${{ steps.set-shards.outputs.shard }}
                  echo ${{ steps.set-shards.outputs.total_shards }}

    nf-core-lint-modules:
        runs-on: ubuntu-latest
        name: nf-core-lint-modules
        needs: [nf-test-changes]
        if: ${{ needs.nf-test-changes.outputs.modules != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                tags: ["${{ fromJson(needs.nf-test-changes.outputs.modules) }}"]
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Set up Python
              uses: actions/setup-python@v7.0.0
              with:
                  python-version: "3.11"

            - uses: actions/cache@v6.1.0
              id: cache-pip
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip
                  restore-keys: |
                      ${{ runner.os }}-pip

            - name: Install pip
              run: python -m pip install --upgrade pip

            - name: Setup Nextflow
              uses: nf-core/setup-nextflow@v3

            - name: Install nf-core tools development version
              run: python -m pip install --upgrade --force-reinstall git+https://github.com/nf-core/tools.git@dev

            - name: Lint module ${{ matrix.tags }}
              run: nf-core -v modules -g https://github.com/GallVp/nxf-components.git lint ${{ matrix.tags }}

    nf-core-lint-subworkflows:
        runs-on: ubuntu-latest
        name: nf-core-lint-modules
        needs: [nf-test-changes]
        if: ${{ needs.nf-test-changes.outputs.subworkflows != '[]' }}
        strategy:
            fail-fast: false
            matrix:
                tags: ["${{ fromJson(needs.nf-test-changes.outputs.subworkflows) }}"]
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Set up Python
              uses: actions/setup-python@v7.0.0
              with:
                  python-version: "3.11"

            - name: Install pip
              run: python -m pip install --upgrade pip

            - name: Setup Nextflow
              uses: nf-core/setup-nextflow@v3

            - name: Install nf-core tools development version
              run: python -m pip install --upgrade --force-reinstall git+https://github.com/nf-core/tools.git@dev

            - name: Lint module ${{ matrix.tags }}
              run: nf-core subworkflows lint ${{ matrix.tags }}

    nf-test:
        runs-on: ubuntu-latest
        name: "nf-test | ${{ matrix.profile }} | shard ${{ matrix.shard }}"
        needs: [nf-test-changes]
        if: ( needs.nf-test-changes.outputs.paths != '[]' )
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJson(needs.nf-test-changes.outputs.shard) }}
                profile: [conda, docker, singularity]
        env:
            NXF_ANSI_LOG: false

        steps:
            - uses: actions/checkout@v7.0.1

            - name: Filter paths
              id: filter
              run: |
                  PATHS='${{ needs.nf-test-changes.outputs.paths }}'
                  FILTERED=$(jq -n -c \
                    --arg profile "${{ matrix.profile }}" \
                    --argjson input_paths "$PATHS" \
                    '
                    def get_skip_list: inputs | .[$profile] // [];

                    # Get skip list and filter
                    get_skip_list as $skip_patterns |

                    # Debug output
                    ($skip_patterns | "Skip patterns: " + (map("  - " + .) | join(","))) |
                    debug |

                    # Do the actual filtering
                    $input_paths | map(
                      . as $path |
                      select($skip_patterns | all(. as $pattern | ($path | startswith($pattern)) | not))
                    ) as $result |

                    # Debug what was skipped
                    (if ($input_paths - $result) | length > 0 then
                      "Skipped: " + (($input_paths - $result) | map("  - " + .) | join(","))
                    else
                      "No paths skipped"
                    end) |
                    debug |

                    $result
                    ' .github/skip_nf_test.json)

                  echo "filtered_paths=${FILTERED}" >> $GITHUB_OUTPUT

            - name: debug
              run: |
                  echo filtered_paths = ${{ steps.filter.outputs.filtered_paths }}

            - name: Run nf-test Action
              if: ${{ steps.filter.outputs.filtered_paths != '[]' }}
              uses: ./.github/actions/nf-test-action
              with:
                  profile: ${{ matrix.profile }}
                  shard: ${{ matrix.shard }}
                  total_shards: ${{ needs.nf-test-changes.outputs.total_shards }}
                  paths: "${{ join(fromJson(steps.filter.outputs.filtered_paths), ' ') }}"

    confirm-pass:
        runs-on: ubuntu-latest
        needs: [pre-commit, nf-core-lint-modules, nf-core-lint-subworkflows, nf-test-changes, nf-test]
        if: always()
        steps:
            - name: All tests ok
              if: ${{ success() || !contains(needs.*.result, 'failure') }}
              run: exit 0
            - name: One or more tests failed
              if: ${{ contains(needs.*.result, 'failure') }}
              run: exit 1

            - name: debug-print
              if: always()
              run: |
                  echo "toJSON(needs) = ${{ toJSON(needs) }}"
                  echo "toJSON(needs.*.result) = ${{ toJSON(needs.*.result) }}"
